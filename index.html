<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">

    <h2>Weby</h2>
    <div class="slot gradient">
      <img src="images/cbaa.jpg" alt="Obrázek 1">
      <a class="btn" target="_blank" href="https://www.cbaa.cz">Přejít na web</a>
    </div>

    <div class="slot gradient">
      <img src="images/resetbody.jpg" alt="Obrázek 2">
      <a class="btn" target="_blank" href="https://www.figma.com/proto/HM2kv0kXkfvzHfXn69UVL0/resetbody?node-id=3-21&viewport=603%2C305%2C0.34&t=1kGAdOvl4RgRsLTT-1&scaling=scale-down-width&content-scaling=fixed&starting-point-node-id=3%3A21&page-id=0%3A1">Přejít do figmy</a>
    </div>

    <div class="slot gradient">
      <img src="images/alfabarber.jpg" alt="Obrázek 2">
      <a class="btn" target="_blank" href="https://www.figma.com/proto/Jgt7FEKXmrldHFhLKcz8og/alfabarber?node-id=2001-3&viewport=401%2C53%2C0.49&t=8hdnzkqegjPfGkQH-1&scaling=scale-down-width&content-scaling=fixed&page-id=2001%3A2">Přejít do figmy</a>
    </div>
    <div class="spacer"></div>

    <h2>Ig příspěvky</h2>
    <div class="grid-2">
        <div class="slot">
          <img src="images/haloween.jpg" alt="Obrázek 1">
        </div>
        <div class="slot">
          <img src="images/haloween2.jpg" alt="Obrázek 2">
        </div>
    </div>
    <div class="spacer"></div>

    <h2>Plakáty</h2>
    <div class="grid-2">
        <div class="slot">
          <img class="poster" src="images/rosice poster.jpg" alt="Obrázek 1">
        </div>
        <div class="slot">
          <img class="poster" src="images/rosice poster2.jpg" alt="Obrázek 2">
        </div>
    </div>
    <div class="spacer"></div>

    <h2>Animace</h2>
    <div class="slot">
      <video autoplay loop muted playsinline>
        <source src="images/psinakup.webm" type="video/webm">
      </video>
    </div>
    <div class="grid-3">
      <div class="slot" style="background-color: #1A1919;" >
        <video autoplay loop muted playsinline>
          <source src="images/EMS-small.mp4" type='video/mp4;'>
        </video>
      </div>
      <div class="slot" style="background-color: #1A1919;">
        <video autoplay loop muted playsinline>
          <source src="images/R&D-out.mp4" type='video/mp4;'>
        </video>
      </div>
      <div class="slot" style="background-color: #1A1919;">
        <video autoplay loop muted playsinline>
          <source src="images/S&R-small.mp4" type="video/mp4">
        </video>
      </div>
      
    </div>
    <div class="spacer"></div>

    <h2>Loga</h2>
    <div class="grid-2">
      <div class="slot logo-bg small" style="background-color: #14213D;">
        <img class="small-logo" src="images/lamito.png" alt="Obrázek 1">
      </div>
      <div class="slot logo-bg" style="background-color: #588282;">
        <img class="logo" src="images/bajafit.svg" alt="Obrázek 2">
      </div>
      <div class="slot logo-bg" style="background-color: #EFEFF3;">
        <img class="logo" src="images/reset.svg" alt="Obrázek 1">
      </div>
      <div class="slot logo-bg" style="background-color: #EFEFF3;">
        <img class="logo" src="images/alkohol plzen.svg" alt="Obrázek 2">
      </div>
    </div>
    <div class="spacer"></div>

    <h2>3D</h2>
    <div class="slot">
      <img src="images/hbh.png" alt="Obrázek 1">
    </div>
  </div>

</body>
</html>
